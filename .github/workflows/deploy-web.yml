name: Deploy website (Cloudflare Pages)

# Deploys logit.ie (apps/clients/website, a static SvelteKit site) to Cloudflare Pages on
# every push to main that touches it or the shared look in packages/ui.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN    token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID   the account id (wrangler whoami)

on:
  push:
    branches: [main]
    paths:
      - "apps/clients/website/**"
      - "packages/ui/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare secret
        id: secret
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN not set — skipping Cloudflare Pages deploy. Deploy manually with 'wrangler pages deploy' or add the secret."
          fi
      - uses: actions/checkout@v4
        if: steps.secret.outputs.configured == 'true'
      - uses: actions/setup-node@v4
        if: steps.secret.outputs.configured == 'true'
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        if: steps.secret.outputs.configured == 'true'
      - name: Build
        if: steps.secret.outputs.configured == 'true'
        working-directory: apps/clients/website
        run: npm run build
      - name: Deploy
        if: steps.secret.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/clients/website
          command: pages deploy .svelte-kit/cloudflare --project-name logit-website --branch main
