name: Deploy website (Cloudflare Pages)

# Deploys getlogit.app (apps/clients/website, a static SvelteKit site) to Cloudflare Pages on
# every push to main that touches it, the shared look in packages/ui, or anything the user docs
# show: the feature list and walkthroughs (packages/core/src/guide) and the web dashboard, whose
# screenshots the docs carry. Before building, it plays every walkthrough against a throwaway
# API and saves a screenshot of each step into static/docs/shots, so the docs always show the
# dashboard as it is. If a walkthrough doesn't play through, nothing is deployed.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN    token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID   the account id (wrangler whoami)

on:
  push:
    branches: [main]
    paths:
      - "apps/clients/website/**"
      - "packages/ui/**"
      - "packages/core/src/guide/**"
      - "apps/clients/logit-web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare secret
        id: secret
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN not set — skipping Cloudflare Pages deploy. Deploy manually with 'wrangler pages deploy' or add the secret."
          fi
      - uses: actions/checkout@v4
        if: steps.secret.outputs.configured == 'true'
      - uses: actions/setup-node@v4
        if: steps.secret.outputs.configured == 'true'
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        if: steps.secret.outputs.configured == 'true'
      - uses: actions/setup-dotnet@v4
        if: steps.secret.outputs.configured == 'true'
        with:
          dotnet-version: "8.0.x"
      - name: Start a throwaway API for the screenshots
        if: steps.secret.outputs.configured == 'true'
        working-directory: services/api/src/Logit.Api
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5118
          Deployment__SelfHosted: "true"
          ConnectionStrings__Default: "Data Source=docs-shots.db"
          Jwt__Secret: "docs-shots-secret-at-least-32-characters-long"
          Registration__SignupsPer10Minutes: "1000"
          Admin__Key: "docs-shots-admin-key-that-is-long-enough-123"
        run: |
          nohup dotnet run --no-launch-profile > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:5118/health && break; sleep 1; done
      - name: Play the walkthroughs and take the docs screenshots
        if: steps.secret.outputs.configured == 'true'
        working-directory: apps/clients/logit-web
        env:
          E2E_API_URL: http://127.0.0.1:5118
          E2E_ADMIN_KEY: "docs-shots-admin-key-that-is-long-enough-123"
        run: |
          npx playwright install --with-deps chromium
          mkdir -p ../website/static/docs/shots
          DOCS_SCREENSHOTS_DIR="$(cd ../website/static/docs/shots && pwd)" npx playwright test
      - name: Build
        if: steps.secret.outputs.configured == 'true'
        working-directory: apps/clients/website
        run: npm run build
      - name: Deploy
        if: steps.secret.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/clients/website
          # Creates the Pages project on the first deploy; fails harmlessly once it exists.
          preCommands: npx --yes wrangler pages project create logit-website --production-branch main || true
          command: pages deploy .svelte-kit/cloudflare --project-name logit-website --branch main
