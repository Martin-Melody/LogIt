name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  DOTNET_VERSION: "8.0.x"

jobs:
  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore services/api/Logit.Api.sln

      - name: Build
        run: dotnet build services/api/Logit.Api.sln -c Release --no-restore

      - name: Test
        run: dotnet test services/api/Logit.Api.sln -c Release --no-build --verbosity normal

      - name: Migration histories in sync (SQLite + Postgres)
        run: |
          # Pinned to the EF Core major the API targets: unpinned it installs the newest
          # dotnet-ef (11.x), which needs a newer .NET than setup-dotnet installs and crashes,
          # so the check below reported a false "model changes not captured" failure.
          dotnet tool install --global dotnet-ef --version "8.*"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/scripts/check-migrations-sync.sh"

  web:
    name: Web (core / frontend / dashboard / website)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the docs review reminder compares the pull request with its base branch
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: core — unit tests
        run: npm run test --workspace @logit/core

      # Pages changed without their docs page: a warning on the pull request naming the docs
      # page to re-read (packages/core/src/guide/docsReview.ts). Never fails the build.
      - name: core — docs to re-read
        if: github.event_name == 'pull_request'
        working-directory: packages/core
        env:
          DOCS_REVIEW_BASE: origin/${{ github.base_ref }}
        run: npx vitest run src/guide/docsReview.test.ts

      - name: frontend — build
        working-directory: apps/clients/logit-frontend
        run: npm run build

      - name: frontend — unit tests
        working-directory: apps/clients/logit-frontend
        run: npm run test:unit

      - name: frontend — svelte-check
        working-directory: apps/clients/logit-frontend
        run: npm run check

      - name: dashboard — build + svelte-check + unit tests
        working-directory: apps/clients/logit-web
        run: npm run build && npm run check && npm test

      - name: website — build + svelte-check
        working-directory: apps/clients/website
        run: npm run build && npm run check

  journeys:
    # Every way into and out of an account — offline, sign-up, buying Pro/Studio, signing out,
    # self-hosting, deleting, switching accounts — run as the phone app (local profiles and
    # the on-device database included, which Playwright's web build can't reach) against two
    # real APIs: one standing in for getlogit.app, one self-hosted.
    name: Account journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Start the two APIs (getlogit.app stand-in :5219, self-hosted :5218)
        env:
          JOURNEY_API_DIR: ${{ runner.temp }}/journey-apis
        run: ./scripts/journey-apis.sh

      - name: Run account journeys
        working-directory: apps/clients/logit-frontend
        run: npm run test:journeys

      - name: API logs on failure
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP"/journey-apis/*.log || true

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browser
        working-directory: apps/clients/logit-frontend
        run: npx playwright install --with-deps chromium

      - name: Start API (SQLite, self-host mode, background)
        working-directory: services/api/src/Logit.Api
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5118
          # self-host mode disables paid-tier gating so /sync is reachable without Stripe
          Deployment__SelfHosted: "true"
          ConnectionStrings__Default: "Data Source=ci-e2e.db"
          Jwt__Secret: "ci-e2e-secret-at-least-32-characters-long"
          # the suite registers far more than the default 10 accounts per address per 10 minutes
          Registration__SignupsPer10Minutes: "1000"
          Auth__LoginsPer10Minutes: "1000"
        run: |
          nohup dotnet run --no-launch-profile > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5118/health && break
            sleep 1
          done

      # Playwright serves a production build (see playwright.config.ts webServer).
      # The API-dependent specs (auth-flow, onboarding, social, sync) rely on the
      # local API started above at :5118.
      - name: Run Playwright tests
        working-directory: apps/clients/logit-frontend
        run: npx playwright test

      # Plays every Pro and Studio walkthrough chapter on the web dashboard, doing each step
      # for real (sample clients included). A page change that breaks a walkthrough fails here.
      - name: Run walkthroughs (web dashboard)
        working-directory: apps/clients/logit-web
        env:
          E2E_API_URL: http://127.0.0.1:5118
          # the Development admin key (appsettings.Development.json), as the phone's sync tests use
          E2E_ADMIN_KEY: "dev-admin-key"
        run: npx playwright test

      - name: API log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/clients/logit-frontend/playwright-report/
            apps/clients/logit-web/playwright-report/
          retention-days: 7
