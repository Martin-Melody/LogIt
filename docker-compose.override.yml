services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: logit
      POSTGRES_USER: logit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql

  api:
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=logit;Username=logit;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    depends_on:
      - postgres

  web:
    ports: !override
      - "3010:3000"

volumes:
  postgres-data:
