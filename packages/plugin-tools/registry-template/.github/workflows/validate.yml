name: Validate registry

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # scripts/lint.mjs is vendored from the Logit repo. Refresh it with:
      #   curl -sL https://raw.githubusercontent.com/Martin-Melody/LogIt/main/packages/plugin-tools/registry-template/scripts/lint.mjs -o scripts/lint.mjs
      - run: npm run lint
