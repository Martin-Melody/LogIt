        - generic [ref=f3e129]:
          - article [ref=f3e130]:
            - heading "Check-ins" [level=1] [ref=f3e131]
            - generic [ref=f3e132]:
              - generic [ref=f3e133]:
                - generic [ref=f3e134]: Studio
                - generic [ref=f3e135]: "Web: Coaching › Check-ins"
                - generic [ref=f3e136]: "Phone: Settings › Coaching › a client"
              - paragraph [ref=f3e137]: Forms clients fill in on a schedule, read next to their week.
              - generic [ref=f3e138]:
                - link "Show me in the app" [ref=f3e139] [cursor=pointer]:
                  - /url: https://app.getlogit.app/?guide=studio.checkins
                - generic [ref=f3e140]: Opens the "Check-ins" chapter of the Studio walkthrough on the web dashboard
            - list [ref=f3e141]:
              - listitem [ref=f3e142]:
                - strong [ref=f3e143]: All check-ins in one place.
                - text: "Open Coaching › Check-ins: answers waiting for you, missed check-ins, ones you've reviewed, and every client's forms."
              - listitem [ref=f3e144]:
                - strong [ref=f3e145]: Forms belong to each client.
                - text: Open a client from Coaching › Clients. With the sample clients, open Conor.
              - listitem [ref=f3e146]:
                - strong [ref=f3e147]: Their check-ins.
                - text: Choose the Check-ins tab.
              - listitem [ref=f3e148]:
                - strong [ref=f3e149]: Add a form.
                - text: Choose Add form. It starts as a weekly form with three questions.
              - listitem [ref=f3e150]:
                - strong [ref=f3e151]: Your questions.
                - text: Change the questions (text, a number, a scale, bodyweight, yes or no, a photo), how often it's due, or archive it. Changes save as you go.
              - listitem [ref=f3e152]:
                - strong [ref=f3e153]: Read and reply.
                - text: "Open the check-in. Their answers sit next to their week's sessions, bodyweight and food. Write a reply and choose Send and mark reviewed: the reply goes to your messages with them, and they see it with the check-in."
            - heading "What your client sees" [level=2] [ref=f3e154]
            - paragraph [ref=f3e155]: The form shows as Due under Check-ins on their phone, or My coach on the web. After you review it, they see it as Reviewed, with your reply, and can look back at every check-in they’ve sent.
            - generic [ref=f3e156]:
              - generic [ref=f3e157]:
                - heading "You can" [level=3] [ref=f3e158]
                - list [ref=f3e159]:
                  - listitem [ref=f3e160]: Mark a check-in reviewed, with or without a reply
                  - listitem [ref=f3e161]: See missed check-ins
              - generic [ref=f3e162]:
                - heading "You can't" [level=3] [ref=f3e163]
                - list [ref=f3e164]:
