services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: "Data Source=/data/logit.db"
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env — see .env.example}
      Jwt__Issuer: logit-api
      Jwt__Audience: logit-app
      Admin__Key: ${ADMIN_KEY:?Set ADMIN_KEY in .env — see .env.example}
      Deployment__SelfHosted: "true"
    volumes:
      - api-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/clients/logit-web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-data:
